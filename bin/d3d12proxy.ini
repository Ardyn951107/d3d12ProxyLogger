; d3d12 proxy + logger settings. Put this file next to d3d12.dll (the game's exe folder).
; Logs go to  <game folder>\d3d12proxy_logs\  (one file per launch, dumps in \dumps\).

[Proxy]
; ---------------------------------------------------------------------------
; TestStep = one-number test presets (override the individual settings below)
;   0 = use the individual settings in this file
;   1 = baseline: remap fallback + full instrumentation (queues, RemoveDevice, probe)
;   2 = runtime 1.619 from .\D3D12_619\ + D3D12 debug layer (exact error messages)
;   3 = force the game's own relocation pass so it fills the remap table (+ fallback)
;   4 = step 3 + runtime 1.619 + debug layer
;   5 = vkd3d-proton (Vulkan) backend: put vkd3d-proton's x64 d3d12.dll + d3d12core.dll
;       into .\vkd3d-proton\ next to the game exe
;   6 = force the render worker's relocation list on (ForceRelocList) + fallback
;   7 = step 6 + TileBacking (map real memory into tiled resources the game never maps)
;   8 = fallback + TileBacking only
;   9 = step 7 + SyncSubmits (GPU wait after every submit; log the one that kills the device)
;  10 = step 9 + RecordLists (record draws/dispatches per command list, dump the list that hangs the GPU)
; ---------------------------------------------------------------------------
TestStep=11

; Feature level passed to D3D12CreateDevice / ID3D12DeviceFactory::CreateDevice
; when the game asks for a higher one. 11_0 = what the original wrapper did.
; 11_1, 12_0, 12_1, or 0 to pass the game's value through unchanged.
ForceFeatureLevel=11_0

; 1 = use OriginalDll from the game folder if it exists, else System32\d3d12.dll
UseOriginalDll=1
OriginalDll=d3d12_original.dll

; 1 = also apply ForceFeatureLevel on the Agility SDK device-factory path
;     (D3D12GetInterface -> ID3D12DeviceFactory::CreateDevice). The original wrapper
;     only handled D3D12CreateDevice.
PatchDeviceFactory=1

; Hook the device to log feature checks and failed Create* calls (PSOs, root
; signatures, resources ...). Shaders/root signatures of failed calls are saved.
HookDevice=1
LogFeatureChecks=1
MaxFeatureLines=400
DumpFailedShaders=1

; GPU crash data (breadcrumbs + page fault info) when the device is removed.
EnableDRED=1
; Poll the device every heartbeat to catch a device-removed even if the game doesn't ask.
PollDeviceRemoved=1
HeartbeatSeconds=30

; D3D12 debug layer: needs the Windows optional feature "Graphics Tools". Slow.
DebugLayer=0
DebugLayerWarnings=0

; Log text the game (or the debug layer) prints with OutputDebugString
CaptureDebugOutput=1
MaxDebugOutputLines=500

; Crash handling
KeepFilterOnTop=1
; full reports for the first N first-chance exceptions, one-liners up to MaxFirstChanceLines
MaxFirstChanceReports=3
MaxFirstChanceLines=60
; minidumps for first-chance exceptions (0 = only on a real crash). Can be slow.
FirstChanceDumps=0
LogCppExceptions=0
; 1 = full-memory dumps (several GB)
FullDump=0

; Original PIX attach feature (loads WinPixGpuCapturer.dll). Off by default.
PixAttach=0

; Crash reports: remember every resource the game creates so a crash report can say
; which resource a crashing lookup used; save the in-memory game code around the
; crash (dumps\code_*.bin) because the exe on disk is encrypted.
TrackResources=1
CodeSnapshots=1
; 1 = on a crash also save the whole decrypted exe from memory (~250 MB) for analysis
ImageDump=0

[Patches]
; In-memory fixes for specific games. Each is located by a byte signature and only
; applied if the code matches exactly, so it does nothing in other games/versions.
; RemapFallback (RE Engine / Pragmata): a "remapped" GPU buffer missing from the
; engine's remap table made the game read a NULL pointer at exe+0x543a2b8.
; With this fix the buffer's own D3D12 resource is used instead.
;   1 = patch the code; if Windows blocks that, fix it in the exception handler
;   2 = exception-handler fix only (game code never modified)
;   0 = off
RemapFallback=1
; ForceRelocation (Pragmata): the remap table is only filled by the game's relocation
; pass, which runs only if bit 32 of the render device's flags is set. 1 = set it.
ForceRelocation=0
; ForceRelocList (Pragmata): the relocation pass only gets work if the render worker's
; "relocation list valid" flag (worker+0x43fc8, from init params +0x2a) is on.
; 1 = keep it on (data write from a watcher thread).
ForceRelocList=0
; TileBacking (any game): reserved/tiled resources that nobody maps get a heap + UpdateTileMappings
; before the first direct-queue submit. Needed on tiled-tier-1 GPUs, where touching an unmapped
; tile removes the device. Pragmata: the 1920x1080 tiled render target.
TileBacking=0
; SkipShaders (any game): comma list of hex shader hashes (from the [lists] dump); draws/dispatches
; using a PSO with one of those shaders are skipped. Brute-force test for a hanging shader.
SkipShaders=
; SkipDraws=1 skips every Draw/DrawIndexed, SkipDispatches=1 every Dispatch (hang tests; rendering will be wrong).
SkipDraws=0
SkipDispatches=0
; SkipClears=1 skips every ClearRenderTargetView/ClearDepthStencilView (hang test; the log shows which resource each clear hits).
SkipClears=0
; ReservedAsCommitted=1: textures the game creates as tiled (reserved) resources are created as ordinary committed textures; tile-mapping calls on them are ignored.
ReservedAsCommitted=0
; OomRetries=N: when a DEFAULT-heap CreateCommittedResource fails with E_OUTOFMEMORY, retry up to N times (100 ms apart) and log VRAM usage. TestStep 11 sets 20.
OomRetries=0
; OomSysMem=1: if a DEFAULT-heap buffer still fails with E_OUTOFMEMORY, create it in system memory (custom heap, pool L0) instead. TestStep 11 sets it.
OomSysMem=0

[Agility]
; Make the OS D3D12 loader use a different Agility SDK runtime than the game ships.
; SDKVersion=0 keeps the game's own (Pragmata: 618 in .\D3D12\).
; SDKVersion=619 + SDKPath=.\D3D12_619\ uses the 1.619 runtime (D3D12Core.dll +
; d3d12SDKLayers.dll), which also makes DebugLayer=1 work.
SDKVersion=0
SDKPath=.\D3D12_619\

[Spoof]
; Capability answers given to the GAME instead of the real ones. Leave empty / delete
; a line to pass the real value. The proxy's own "Device caps" log section always
; shows the real values; "[spoof]" lines show what was changed.
; Spoofing a feature UP that the GPU lacks makes the game try to use it - watch
; for "!! ... FAILED" lines. Spoofing DOWN pushes the game onto older code paths.
;
; MaxFeatureLevel=12_1          ; answer to FEATURE_LEVELS (11_0 11_1 12_0 12_1 12_2)
; HighestShaderModel=6_6        ; caps the shader model answer
; ResourceBindingTier=3         ; 1-3
; TiledResourcesTier=3          ; 0-4   (GTX 960M: 1)
; ResourceHeapTier=2            ; 1-2   (GTX 960M: 1)
; ConservativeRasterizationTier=1 ; 0-3 (GTX 960M: 0)
; ROVsSupported=1               ; 0/1   (GTX 960M: 0)
; TypedUAVLoadAdditionalFormats=1
; PSSpecifiedStencilRefSupported=1
; VPAndRTArrayIndexFromAnyShader=1
; WaveOps=1
; Int64ShaderOps=1
; Barycentrics=1
; Native16BitShaderOps=1
; RaytracingTier=0              ; 0, 10 (=1.0), 11 (=1.1)
; RenderPassesTier=0
; VariableShadingRateTier=0
; MeshShaderTier=0              ; 0 or 10
; SamplerFeedbackTier=0         ; 0, 90, 100
; EnhancedBarriers=0
; GPUUploadHeap=0
; TightAlignmentTier=0          ; 0-1  (D3D12_FEATURE_D3D12_TIGHT_ALIGNMENT)
